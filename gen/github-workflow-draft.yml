# Draft GitHub Actions workflow. Not yet run on GitHub.
# Copy to .github/workflows/update.yml once this repo is public.
# Regenerates the rules daily; commits only when the content changed and the
# playback test passes. Bump UBO_REF deliberately: it is code that runs here.
name: regenerate rules
on:
  schedule: [ { cron: '17 5 * * *' } ]
  workflow_dispatch: {}
permissions: { contents: write }
env:
  UBO_REF: 844e74ea11ac5fcd66973b062390c30e991bbffb
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node gen/generate.mjs
      - run: node build.mjs
      - run: node --check dist/tubeclean.js
      - name: playback test
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps webkit
          node test/playback.mjs dist/tubeclean.js dQw4w9WgXcQ kJQP7kiw5Fk   # exits non-zero on failure
      - name: commit if changed
        run: |
          git config user.name tubeclean-bot
          git config user.email tubeclean-bot@users.noreply.github.com
          git add dist/tubeclean.js generated/
          git diff --cached --quiet dist/tubeclean.js && exit 0
          git commit -m "rules $(head -1 dist/tubeclean.js | grep -o 'version=[0-9]*')"
          git push
